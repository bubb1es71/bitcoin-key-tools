name: Audit

on:
  # Nightly at 00:00 UTC
  schedule:
    - cron: "0 0 * * *"
  # When PRs change dependencies
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "**/audit.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5

      - name: Audit Cargo.lock against RustSec advisory database
        uses: actions-rust-lang/audit@v1
