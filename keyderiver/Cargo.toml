[package]
name = "keyderiver"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
bitcoin = { version = "0.32", default-features = false }
clap = { version = "4.6.6", features = ["derive"] }
zeroize = "1"

[dev-dependencies]
bip39 = { version = "2.2", default-features = false, features = ["alloc"] }
